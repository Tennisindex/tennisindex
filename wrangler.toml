name = "tennisindex"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Workers Builds runs `npx wrangler deploy` after `npm run build`.
# This is a Worker with static assets, not a Pages-only project.
[assets]
directory = ".svelte-kit/cloudflare"
binding = "ASSETS"

# Plain dashboard vars are wiped on each `wrangler deploy`. Keep public bindings here.
# SUPABASE_SERVICE_ROLE_KEY must be an encrypted Worker Secret (not a Build variable).
[vars]
# TennisIndex production Supabase project (Project Settings -> API).
PUBLIC_SUPABASE_URL = "https://wxffzlowypugrmosfbch.supabase.co"
PUBLIC_SUPABASE_ANON_KEY = "sb_publishable_0qVOJXnKAKkwrc-pUq2pHQ_ugf_-AiX"
# "12 Monate kostenlos"-Aktion für Vereine — auf "false" oder Zeile entfernen,
# sobald echte Preise feststehen.
PUBLIC_TRIAL_OFFER_ENABLED = "true"

# Cloudflare Web Analytics: im Cloudflare-Dashboard unter "Web Analytics" die
# Domain hinzufügen, den dort erzeugten Site-Token hier eintragen. Leer = kein
# Analytics-Script wird geladen.
PUBLIC_CF_BEACON_TOKEN = ""

# 48h-Bestätigung: später aktivieren, sobald der Match-Flow steht.
# [triggers]
# crons = ["*/15 * * * *"]
